name: Build OpenJDK 25 for iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_iosport:
    name: "Build Java 25 for iOS aarch64"
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bootstrap JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install build dependencies
        run: |
          brew install autoconf freetype

      - name: Apply icache patch to local JDK clone
        run: |
          chmod +x patch_icache.sh
          sed -i '' "s|/tmp/openjdk-25-ios|$GITHUB_WORKSPACE/openjdk-25-clone|g" patch_icache.sh
          ./patch_icache.sh

      - name: Build OpenJDK for iOS
        working-directory: ./angelauramc-openjdk-build
        env:
          TARGET: aarch64-macos-ios
          TARGET_JDK: aarch64
          BUILD_IOS: 1
          BUILD_FREETYPE_VERSION: "2.10.4"
          JDK_DEBUG_LEVEL: "release"
          JVM_VARIANTS: "server"
          TARGET_VERSION: 25
        run: |
          chmod +x *.sh
          ./getlibs.sh
          ./buildlibs.sh
          ./clonejdk.sh
          ./buildjdk.sh
          ./removejdkdebuginfo.sh
          ./tarjdk.sh

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre25-ios-aarch64"
          path: angelauramc-openjdk-build/*.tar.xz
